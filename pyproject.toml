[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dailies"
version = "0.1.0"
description = "AI reliability layer for render pipelines"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # >=1.30, not 1.27: `create_histogram` only grew the
  # `explicit_bucket_boundaries_advisory` keyword in 1.30, and the emitter passes it.
  # On 1.27 a clean minimum-version install would TypeError at instrument creation.
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "pydantic>=2.9",
]

[project.optional-dependencies]
# httpx: not a runtime dependency. Starlette's TestClient is an httpx client, so the
# API route tests do not collect without it, and it is absent from FastAPI's base
# install (it ships in fastapi[standard], which this project does not take).
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "httpx>=0.27"]
# >=1.20, not 1.0: the investigator was built and verified against google-adk 1.20.0's
# actual surface (`LlmAgent.tools` accepting `BaseTool`, `FunctionTool` deriving its
# declaration from a bound method's signature, `{name}` state injection into a string
# instruction). AGENTS.md requires ADK signatures to be verified rather than assumed, and
# nothing older than 1.20 has been.
#
# httpx is declared here rather than left to arrive under `mcp`: dailies_api.mcp_transport
# imports it directly to speak Streamable HTTP to the Grafana MCP server, and a direct
# import on a transitive dependency breaks silently the day the intermediary drops it.
#
# Capped <2 for the same reason the OpenTelemetry pins are: the image is built with an
# unlocked `pip install ".[agent]"`, so an unbounded floor lets a major release change the
# container without changing this repo, and nothing in the suite drives the ADK surface
# `run_agent` uses (InMemoryRunner, session_service.create_session, event.is_final_response).
agent = ["google-adk>=1.20,<2", "mcp>=1.2", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["packages/telemetry", "packages/render", "packages/graph", "apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
