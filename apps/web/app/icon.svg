<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dailies">
  <!--
    The clapperboard, which is already the mast's motif: a striped bar over a slate.
    Drawn for 16px first. Thin stripes disappear at favicon size, so there are four thick
    ones at the same 115deg the board's .stripe uses, and the accent is the yellow the
    report headers and the Diagnose button already own.
  -->
  <defs>
    <clipPath id="bar">
      <path d="M4 4 h56 v18 h-56 z" />
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="10" fill="#0b0b0b" />

  <!-- The hinged top bar. -->
  <path d="M4 4 h56 v18 h-56 z" fill="#ffd400" />
  <g clip-path="url(#bar)" fill="#0b0b0b">
    <path d="M2 26 L14 -2 L23 -2 L11 26 z" />
    <path d="M20 26 L32 -2 L41 -2 L29 26 z" />
    <path d="M38 26 L50 -2 L59 -2 L47 26 z" />
    <path d="M56 26 L68 -2 L77 -2 L65 26 z" />
  </g>

  <!--
    The slate below, with one frame marked. A grey field and a single magenta cell is the
    whole product in one glyph: every frame reads complete, and one of them is wrong.
  -->
  <g fill="#3a3a3a">
    <rect x="9" y="31" width="13" height="10" rx="2" />
    <rect x="26" y="31" width="13" height="10" rx="2" />
    <rect x="9" y="45" width="13" height="10" rx="2" />
    <rect x="26" y="45" width="13" height="10" rx="2" />
    <rect x="43" y="31" width="12" height="10" rx="2" />
  </g>
  <rect x="43" y="45" width="12" height="10" rx="2" fill="#c026d3" />
</svg>
